[project]
name = "gca-core"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "gcattr",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "nats-py>=2.9",
    "pydantic-settings>=2.6",
    "githubkit[auth-app]>=0.11",
    "jsonschema>=4.23",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gca_core"]
