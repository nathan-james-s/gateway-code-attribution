[project]
name = "gca-prcheck"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "gcattr",
    "gca-core",
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gca_prcheck"]
