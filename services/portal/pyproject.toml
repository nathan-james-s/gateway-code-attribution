[project]
name = "gca-portal"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "gcattr",
    "gca-core",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "jinja2>=3.1",
    "kubernetes>=31.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.entry-points."gca.commands"]
setup = "gca_portal.setup_cli:register"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gca_portal"]
