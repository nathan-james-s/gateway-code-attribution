name: scn-edited
kind: scenario
description: AI-written lines, then the developer renames a variable.
steps:
  - format: anthropic_messages
    file: src/scenarios/coupons.py
    write: |
      """Coupon validation for the scenario suite."""

      from dataclasses import dataclass


      @dataclass(frozen=True)
      class Coupon:
          code: str
          percent_off: int
          minimum_cents: int


      def coupon_discount_cents(coupon: Coupon, subtotal_cents: int) -> int:
          if subtotal_cents < coupon.minimum_cents:
              return 0
          discount = subtotal_cents * coupon.percent_off // 100
          return min(discount, subtotal_cents)
human_edits:
  - file: src/scenarios/coupons.py
    replace: {old: "    discount = subtotal_cents", new: "    amount = subtotal_cents"}
  - file: src/scenarios/coupons.py
    replace: {old: "    return min(discount, subtotal_cents)", new: "    return min(amount, subtotal_cents)"}
expect:
  # Both lines are AI-written with one identifier renamed, so both are AI modified, anchored by the file's exact
  # matches: the 15-token line at about 0.9 similarity, and the 7-token one at about 0.5 (4 of its 8 token pairs
  # survive the rename). The answer key must hold under any fingerprint key (tests/test_scenarios.py).
  ai_modified: ["amount = subtotal_cents * coupon.percent_off // 100", "return min(amount, subtotal_cents)"]
