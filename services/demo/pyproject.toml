[project]
name = "gca-demo"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
    "gcattr",
    "gca-core",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.entry-points."gca.commands"]
demo = "gca_demo.agent:register"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gca_demo"]

[tool.hatch.build.targets.wheel.force-include]
"sample-repo" = "gca_demo/sample_repo"
