# Required merge gates (constitution "Development Workflow & Quality Gates"; T066). Listed as required status
# checks in docs/maintainers.md. T095, T110 and T113 add jobs here.
name: gates
on:
  pull_request:
permissions:
  contents: read
  pull-requests: read   # dorny/paths-filter lists the PR's changed files through the API
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      capture: ${{ steps.f.outputs.capture }}
      stack: ${{ steps.f.outputs.stack }}
    steps:
      - uses: actions/checkout@v4
      - id: f
        uses: dorny/paths-filter@v3
        with:
          filters: |
            capture:
              - 'lib/**'
              - 'services/core/**'
              - 'services/capture-*/**'
            stack:
              - 'lib/**'
              - 'services/**'
              - 'charts/**'

  no-recorder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/check-no-recorder.sh

  release-bar:  # T110: the spec's SC-002/SC-003 and the schema's release_bar constants agree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/check-release-bar.sh

  conformance:
    needs: changes
    if: needs.changes.outputs.capture == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-packages -p 3.12
      - run: uv run pytest tests/conformance

  # Stack gate and data-path gate share one job and one cluster. The end-to-end test installs each gateway in
  # turn (per-line parity needs both), then the privacy audit inspects what those runs left behind (T064, T065).
  clean-install-and-privacy:
    needs: changes
    if: needs.changes.outputs.stack == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GCA_E2E: "1"
      GCA_E2E_APP: ${{ secrets.GCA_E2E_APP }}
      GCA_E2E_REPO: ${{ secrets.GCA_E2E_REPO }}
      GH_TOKEN: ${{ secrets.GCA_E2E_GH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: azure/setup-helm@v4
      - uses: helm/kind-action@v1
        with:
          install_only: true
      - run: uv sync --all-packages -p 3.12
      - name: secrets configured?
        id: secrets
        run: |
          if [ -n "$GCA_E2E_REPO" ] && [ -n "$GCA_E2E_APP" ] && [ -n "$GH_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=clean-install-and-privacy not run::Set the GCA_E2E_APP, GCA_E2E_REPO and GCA_E2E_GH_TOKEN repository secrets (docs/maintainers.md). Until then this gate does not test the stack."
          fi
      - if: steps.secrets.outputs.present == 'true'
        run: gh auth setup-git
      - name: clean-install (both gateways; time to first result, M7) then privacy audit
        if: steps.secrets.outputs.present == 'true'
        run: uv run pytest tests/e2e/test_us1_demo.py tests/privacy -x -s --gateway both
