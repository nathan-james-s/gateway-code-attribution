# Gateway Code Attribution — values (contract: specs/001-gateway-code-attribution/contracts/helm-values.md).
# Every image is pinned by tag and digest (Constitution VI). scripts/pin-digests.sh refreshes the digests.

gateway:
  type: agentgateway            # REQUIRED: agentgateway | litellm (FR-001)
  publicUrl: ""                 # URL developers' tools use; empty = cluster Service + port-forward instructions
  agentgateway:
    image: {repository: cr.agentgateway.dev/agentgateway, tag: v1.6.0, digest: "sha256:9d3e6044ddcdc0878b1787f77bd401252b95e22684203fb5e874c4c42d2ed90c"}
  litellm:
    # Built by this project: LiteLLM v1.105.1 with the gcattr_litellm callback (T037).
    image: {repository: ghcr.io/nathan-james-s/gca-litellm, tag: v1.105.1-gca0.1.0, digest: ""}

providers:                      # BYO hosted key mode (FR-039); empty in demo mode
  existingSecret: ""            # Secret with ANTHROPIC_API_KEY / OPENAI_API_KEY / GEMINI_API_KEY
  models: []                    # [{name, provider: anthropic|openAI|gemini, model}]

demo:
  enabled: false                # true -> deploys demo-model and routes demo model names to it (FR-038)
  agent: {enabled: true}

github:                         # from `gca setup github-app` (never shipped with defaults; FR-035)
  existingSecret: ""            # keys: appId, clientId, clientSecret, privateKey, webhookSecret
  org: ""                       # organization whose teams and owners drive roles (FR-027, FR-029a)
  host: github.com              # GitHub.com / Enterprise Cloud only in v1

prcheck:
  delivery: polling             # polling (local) | webhook (needs publicUrl)
  publicUrl: ""
  pendingCapMinutes: 10         # R12
  headlineIncludesBroad: false

attribution:
  matchingWindowDays: 14
  retentionDays: 90
  exclusions: ["**/*.lock", "**/package-lock.json", "**/vendor/**", "**/node_modules/**", "**/*.min.*", "**/dist/**"]

perDeveloper:
  enabled: true                 # FR-029 default
  visibleRoles: [admin, team_lead]

fingerprintKey:
  existingSecret: ""            # otherwise generated at install and kept across upgrades (lookup); rotate via the portal

postgres:
  internal: true                # official postgres:17 StatefulSet (no Bitnami)
  storage: 100Gi                # sized for SC-013; see docs/sizing.md
  storageClassName: ""
  image: {repository: docker.io/library/postgres, tag: "17", digest: "sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3"}
  external: {host: "", port: 5432, database: "", existingSecret: ""}   # existingSecret keys: username, password, reportingPassword

# Project images (built by scripts/build-images.sh; released by .github/workflows/release.yml).
images:
  registry: ghcr.io/nathan-james-s
  tag: "0.1.0"
  pullPolicy: IfNotPresent

nats:                           # official nats-io chart dependency, JetStream single node
  enabled: true
  config:
    jetstream:
      enabled: true
      fileStore:
        pvc:
          size: 10Gi
  container:
    image:
      repository: nats
      tag: 2.15.1-alpine

grafana:                        # grafana-community chart dependency (image 13.2.4); aggregate views only (R15)
  enabled: true
  publicUrl: http://localhost:3000   # browser-reachable URL (this project's key; GitHub sign-in returns here)
  image:
    repository: grafana/grafana
    tag: 13.2.4
  adminPassword: ""             # generated by the Grafana chart when empty
  # A subchart can't read github.existingSecret, so the Secret is named here too. validate.yaml fails the
  # install when the two differ: change both together.
  envValueFrom:
    GF_AUTH_GITHUB_CLIENT_ID: {secretKeyRef: {name: gca-github-app, key: clientId}}
    GF_AUTH_GITHUB_CLIENT_SECRET: {secretKeyRef: {name: gca-github-app, key: clientSecret}}
    GCA_REPORTING_PASSWORD: {secretKeyRef: {name: "{{ .Release.Name }}-gca-postgres", key: reportingPassword}}
  envFromConfigMaps:
    - name: "{{ .Release.Name }}-gca-grafana-env"   # root URL and allowed organization (grafana-provisioning.yaml)
  grafana.ini:
    auth:
      disable_login_form: false  # the admin account stays available
    auth.anonymous:
      enabled: false
    auth.github:
      enabled: true
      allow_sign_up: true
      scopes: user:email,read:org
    users:
      auto_assign_org_role: Viewer
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Gateway Code Attribution
          uid: gca
          type: grafana-postgresql-datasource
          url: "{{ .Release.Name }}-gca-postgres:5432"
          user: gca_reporting           # SELECT on the reporting views only (migration 0002)
          isDefault: true
          jsonData: {database: gca, sslmode: disable, postgresVersion: 1700}
          secureJsonData:
            password: "$__env{GCA_REPORTING_PASSWORD}"
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: gca
          folder: Gateway Code Attribution
          type: file
          disableDeletion: true
          editable: false
          options: {path: /var/lib/grafana/dashboards/gca}
  dashboardsConfigMaps:
    gca: "{{ .Release.Name }}-gca-dashboards"
  service:
    type: ClusterIP
    port: 3000

expose:                         # local clusters: kind maps localhost ports to these node ports (scripts/demo.sh)
  nodePorts: false
  portal: 30080
  gateway: 30400

portal:
  publicUrl: ""                 # browser-reachable URL; localhost works for the demo
