{{- /* Generated secrets persist across upgrades via lookup (FR-035). Values are never inline in values.yaml. */ -}}
{{- if not .Values.fingerprintKey.existingSecret }}
{{- $name := printf "%s-fingerprint-key" (include "gca.fullname" .) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "gca.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if $existing }}
  {{- range $k, $v := $existing.data }}
  {{ $k | quote }}: {{ $v }}
  {{- end }}
  {{- else }}
  "1": {{ randBytes 32 | b64enc }}
  active: {{ "1" | b64enc }}
  {{- end }}
{{- end }}
{{- if .Values.postgres.internal }}
---
{{- $pg := printf "%s-postgres" (include "gca.fullname" .) }}
{{- $pgExisting := lookup "v1" "Secret" .Release.Namespace $pg }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $pg }}
  labels: {{- include "gca.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if $pgExisting }}
  username: {{ index $pgExisting.data "username" }}
  password: {{ index $pgExisting.data "password" }}
  reportingPassword: {{ index $pgExisting.data "reportingPassword" }}
  {{- else }}
  username: {{ "gca" | b64enc }}
  password: {{ randAlphaNum 32 | b64enc }}
  reportingPassword: {{ randAlphaNum 32 | b64enc }}
  {{- end }}
{{- end }}
