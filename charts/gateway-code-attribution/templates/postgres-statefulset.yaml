{{- if .Values.postgres.internal }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "gca.fullname" . }}-postgres
  labels: {{- include "gca.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector: {{- include "gca.selector" (dict "root" . "component" "postgres") | nindent 4 }}
  ports:
    - {name: postgres, port: 5432, targetPort: 5432}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "gca.fullname" . }}-postgres
  labels: {{- include "gca.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "gca.fullname" . }}-postgres
  replicas: 1
  selector:
    matchLabels: {{- include "gca.selector" (dict "root" . "component" "postgres") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "gca.labels" . | nindent 8 }}
        app.kubernetes.io/component: postgres
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: postgres
          image: {{ include "gca.image" .Values.postgres.image }}
          env:
            - {name: POSTGRES_DB, value: gca}
            - name: POSTGRES_USER
              valueFrom: {secretKeyRef: {name: {{ include "gca.postgresSecret" . }}, key: username}}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ include "gca.postgresSecret" . }}, key: password}}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
            - {name: TZ, value: UTC}
          ports:
            - {name: postgres, containerPort: 5432}
          readinessProbe:
            exec: {command: ["pg_isready", "-U", "gca", "-d", "gca"]}
            periodSeconds: 5
          securityContext: {{- include "gca.containerSecurity" . | nindent 12 }}
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {memory: 2Gi}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: run, mountPath: /var/run/postgresql}
            - {name: tmp, mountPath: /tmp}   # the root filesystem is read-only
      volumes:
        - {name: run, emptyDir: {}}
        - {name: tmp, emptyDir: {sizeLimit: 256Mi}}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.postgres.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}
{{- end }}
