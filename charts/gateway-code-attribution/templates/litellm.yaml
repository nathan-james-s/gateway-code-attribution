{{- if eq .Values.gateway.type "litellm" }}
{{- $fn := include "gca.fullname" . }}
{{- $mk := printf "%s-litellm-master" $fn }}
{{- $mkExisting := lookup "v1" "Secret" .Release.Namespace $mk }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $mk }}
  labels: {{- include "gca.labels" . | nindent 4 }}
  annotations: {helm.sh/resource-policy: keep}
type: Opaque
data:
  {{- if $mkExisting }}
  masterKey: {{ index $mkExisting.data "masterKey" }}
  {{- else }}
  masterKey: {{ printf "sk-%s" (randAlphaNum 40) | b64enc }}
  {{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fn }}-litellm
  labels: {{- include "gca.labels" . | nindent 4 }}
data:
  config.yaml: |
    {{- include "gca.litellmConfig" . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fn }}-gateway
  labels: {{- include "gca.labels" . | nindent 4 }}
spec:
  {{- if .Values.expose.nodePorts }}
  type: NodePort
  {{- end }}
  selector: {{- include "gca.selector" (dict "root" . "component" "gateway") | nindent 4 }}
  ports:
    - {name: http, port: 4000, targetPort: 4000{{- if .Values.expose.nodePorts }}, nodePort: {{ .Values.expose.gateway }}{{- end }}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fn }}-gateway
  labels: {{- include "gca.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: {{- include "gca.selector" (dict "root" . "component" "gateway") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "gca.labels" . | nindent 8 }}
        app.kubernetes.io/component: gateway
      annotations:
        checksum/config: {{ include "gca.litellmConfig" . | sha256sum }}
    spec:
      securityContext: {{- include "gca.podSecurity" . | nindent 8 }}
      containers:
        - name: litellm
          image: {{ include "gca.image" .Values.gateway.litellm.image }}
          args: ["--config", "/etc/litellm/config.yaml", "--port", "4000"]
          ports:
            - {name: http, containerPort: 4000}
          env:
            {{- include "gca.dbEnv" . | nindent 12 }}
            - name: DATABASE_URL   # Prisma: separate schema so LiteLLM's tables never mix with ours
              value: "postgresql://$(PGUSER):$(PGPASSWORD)@{{ include "gca.postgresHost" . }}:{{ .Values.postgres.external.port | default 5432 }}/{{ if .Values.postgres.internal }}gca{{ else }}{{ .Values.postgres.external.database }}{{ end }}?schema=litellm"
            - name: LITELLM_MASTER_KEY
              valueFrom: {secretKeyRef: {name: {{ $mk }}, key: masterKey}}
            - {name: LITELLM_LOG, value: ERROR}
            {{- if .Values.providers.existingSecret }}
            {{- $names := list "ANTHROPIC_API_KEY" "OPENAI_API_KEY" "GEMINI_API_KEY" }}
            {{- range .Values.providers.models }}{{ with .apiKeyName }}{{ $names = append $names . }}{{ end }}{{ end }}
            {{- range $names | uniq }}
            - name: {{ include "gca.providerKeyEnv" . }}
              valueFrom: {secretKeyRef: {name: {{ $.Values.providers.existingSecret }}, key: {{ . }}, optional: true}}
            {{- end }}
            {{- end }}
          readinessProbe:
            httpGet: {path: /health/liveliness, port: 4000}
            periodSeconds: 5
            failureThreshold: 30
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {memory: 2Gi}
          volumeMounts:
            - {name: config, mountPath: /etc/litellm, readOnly: true}
            # Prisma's toolchain writes caches at start-up; the root filesystem stays read-only.
            - {name: tmp, mountPath: /tmp}
            - {name: home, mountPath: /home/gca}
            {{- include "gca.keysMount" . | nindent 12 }}
      volumes:
        - {name: tmp, emptyDir: {sizeLimit: 256Mi}}
        - {name: home, emptyDir: {sizeLimit: 512Mi}}
        - name: config
          configMap: {name: {{ $fn }}-litellm}
        {{- include "gca.keysVolume" . | nindent 8 }}
{{- end }}
