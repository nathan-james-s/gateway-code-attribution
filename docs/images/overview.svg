<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="575" viewBox="0 0 1200 575" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker><marker id="ah-rev" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#57606a"/></marker></defs>
<rect x="30" y="40" width="230" height="110" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
<text x="145.0" y="64" text-anchor="middle" font-weight="600" font-size="15" fill="#1f2328">Coding tools</text>
<text x="145.0" y="84" text-anchor="middle" font-size="12" fill="#57606a">Claude Code · Codex CLI</text>
<text x="145.0" y="101" text-anchor="middle" font-size="12" fill="#57606a">Gemini CLI · OpenCode</text>
<text x="145.0" y="118" text-anchor="middle" font-size="12" fill="#57606a">endpoint + key, nothing installed</text>
<rect x="400" y="40" width="260" height="110" rx="8" fill="#ddf4ff" stroke="#54aeff" stroke-width="1.5"/>
<text x="530.0" y="64" text-anchor="middle" font-weight="600" font-size="15" fill="#0969da">AI gateway</text>
<text x="530.0" y="84" text-anchor="middle" font-size="12" fill="#57606a">agentgateway or LiteLLM</text>
<text x="530.0" y="101" text-anchor="middle" font-size="12" fill="#57606a">fails open: capture never</text>
<text x="530.0" y="118" text-anchor="middle" font-size="12" fill="#57606a">delays or blocks a response</text>
<rect x="800" y="40" width="230" height="110" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
<text x="915.0" y="64" text-anchor="middle" font-weight="600" font-size="15" fill="#1f2328">Model provider</text>
<text x="915.0" y="84" text-anchor="middle" font-size="12" fill="#57606a">Anthropic · OpenAI · Gemini</text>
<text x="915.0" y="101" text-anchor="middle" font-size="12" fill="#57606a">or the built-in demo model</text>
<text x="915.0" y="118" text-anchor="middle" font-size="12" fill="#57606a">(no key needed for the demo)</text>
<path d="M260,78 L400,78" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="330" y="70" text-anchor="middle" font-size="11.5" fill="#57606a">request</text>
<path d="M400,118 L260,118" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="330" y="136" text-anchor="middle" font-size="11.5" fill="#57606a">response, untouched</text>
<path d="M660,78 L800,78" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="730" y="70" text-anchor="middle" font-size="11.5" fill="#57606a">request</text>
<path d="M800,118 L660,118" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="730" y="136" text-anchor="middle" font-size="11.5" fill="#57606a">streamed response</text>
<path d="M530,150 L530,215" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="540" y="188" text-anchor="start" font-size="11.5" fill="#57606a">a copy of the response stream</text>
<rect x="400" y="215" width="260" height="100" rx="8" fill="#ddf4ff" stroke="#54aeff" stroke-width="1.5"/>
<text x="530.0" y="239" text-anchor="middle" font-weight="600" font-size="15" fill="#0969da">Capture</text>
<text x="530.0" y="259" text-anchor="middle" font-size="12" fill="#57606a">ext_proc or LiteLLM callback</text>
<text x="530.0" y="276" text-anchor="middle" font-size="12" fill="#57606a">reassemble tool calls, normalize lines,</text>
<text x="530.0" y="293" text-anchor="middle" font-size="12" fill="#57606a">HMAC each line, drop the text</text>
<rect x="700" y="235" width="130" height="60" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
<text x="765.0" y="259" text-anchor="middle" font-weight="600" font-size="15" fill="#1f2328">NATS JetStream</text>
<text x="765.0" y="279" text-anchor="middle" font-size="12" fill="#57606a">buffer</text>
<rect x="880" y="235" width="110" height="60" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
<text x="935.0" y="259" text-anchor="middle" font-weight="600" font-size="15" fill="#1f2328">Ingest</text>
<text x="935.0" y="279" text-anchor="middle" font-size="12" fill="#57606a">loss detection</text>
<rect x="1040" y="215" width="130" height="100" rx="8" fill="#dafbe1" stroke="#4ac26b" stroke-width="1.5"/>
<text x="1105.0" y="239" text-anchor="middle" font-weight="600" font-size="15" fill="#1f2328">PostgreSQL</text>
<text x="1105.0" y="259" text-anchor="middle" font-size="12" fill="#57606a">keyed fingerprints</text>
<text x="1105.0" y="276" text-anchor="middle" font-size="12" fill="#57606a">and metadata</text>
<text x="1105.0" y="293" text-anchor="middle" font-size="12" fill="#57606a">never code or prompts</text>
<path d="M660,265 L700,265" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M830,265 L880,265" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M990,265 L1040,265" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="30" y="390" width="230" height="90" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
<text x="145.0" y="414" text-anchor="middle" font-weight="600" font-size="15" fill="#1f2328">GitHub</text>
<text x="145.0" y="434" text-anchor="middle" font-size="12" fill="#57606a">pull request opened</text>
<text x="145.0" y="451" text-anchor="middle" font-size="12" fill="#57606a">or pushed to</text>
<rect x="400" y="380" width="260" height="110" rx="8" fill="#ddf4ff" stroke="#54aeff" stroke-width="1.5"/>
<text x="530.0" y="404" text-anchor="middle" font-weight="600" font-size="15" fill="#0969da">PR check (GitHub App)</text>
<text x="530.0" y="424" text-anchor="middle" font-size="12" fill="#57606a">same library, same key:</text>
<text x="530.0" y="441" text-anchor="middle" font-size="12" fill="#57606a">fingerprint every added line and</text>
<text x="530.0" y="458" text-anchor="middle" font-size="12" fill="#57606a">look it up among the author's captures</text>
<path d="M260,435 L400,435" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="330" y="427" text-anchor="middle" font-size="11.5" fill="#57606a">webhook or poll</text>
<path d="M530,380 L530,350 L1105,350 L1105,315" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#ah)" marker-start="url(#ah-rev)"/>
<text x="817" y="342" text-anchor="middle" font-size="11.5" fill="#57606a">lookup by fingerprint, per author, within the 14-day matching window</text>
<rect x="700" y="390" width="200" height="70" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
<text x="800.0" y="414" text-anchor="middle" font-weight="600" font-size="15" fill="#1f2328">Check run on the PR</text>
<text x="800.0" y="434" text-anchor="middle" font-size="12" fill="#57606a">every added line labelled</text>
<rect x="950" y="390" width="220" height="70" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
<text x="1060.0" y="414" text-anchor="middle" font-weight="600" font-size="15" fill="#1f2328">Portal and Grafana</text>
<text x="1060.0" y="434" text-anchor="middle" font-size="12" fill="#57606a">change · repository · team · developer</text>
<path d="M660,425 L700,425" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M900,425 L950,425" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="30" y="531" font-size="12.5" fill="#57606a">Each added line gets exactly one of:</text>
<rect x="262" y="513" width="148" height="26" rx="13" fill="#1a7f37" opacity="0.15"/>
<text x="336.0" y="530" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1a7f37">AI, unmodified</text>
<rect x="420" y="513" width="301" height="26" rx="13" fill="#9a6700" opacity="0.15"/>
<text x="570.5" y="530" text-anchor="middle" font-size="12.5" font-weight="600" fill="#9a6700">AI, modified (anchored / broad)</text>
<rect x="731" y="513" width="67" height="26" rx="13" fill="#0969da" opacity="0.15"/>
<text x="764.5" y="530" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0969da">Human</text>
<rect x="808" y="513" width="139" height="26" rx="13" fill="#6e7781" opacity="0.15"/>
<text x="877.5" y="530" text-anchor="middle" font-size="12.5" font-weight="600" fill="#6e7781">Indeterminate</text>
<rect x="957" y="513" width="130" height="26" rx="13" fill="none" stroke="#6e7781" stroke-width="1.5"/>
<text x="1022.0" y="530" text-anchor="middle" font-size="12.5" font-weight="600" fill="#6e7781">Not observed</text>
</svg>