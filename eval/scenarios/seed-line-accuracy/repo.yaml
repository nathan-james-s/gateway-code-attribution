  message: 'ada: change'
  files:
    src/inventory.py: "class OutOfStock(Exception):\n    pass\n\n\ndef reserve(stock, sku, quantity):\n    available = stock.get(sku,\
      \ 0)\n    if available < quantity:\n        raise OutOfStock(f\"{sku}: {available} left, {quantity} requested\")\n \
      \   stock[sku] = available - quantity\n    return stock[sku]\n\n\ndef restock(stock, sku, quantity):\n    stock[sku]\
      \ = stock.get(sku, 0) + max(quantity, 0)\n    return stock[sku]\n\n\ndef low_stock(stock, threshold=5):\n    return\
      \ sorted(sku for sku, count in stock.items() if count <= threshold)\n"
