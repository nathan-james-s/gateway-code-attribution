      \ function receiptTotal(lines: ReceiptLine[]): number {\n  return lines.reduce((sum, line) => sum + line.totalCents,\
      \ 0);\n}\n\n// Lines with a zero quantity are refunds and don't count as items.\nexport function receiptCount(lines:\
      \ ReceiptLine[]): number {\n  return lines.filter((line) => line.quantity > 0).length;\n}\n"
