    src/pricing.py: "from dataclasses import dataclass\n\n\n@dataclass(frozen=True)\nclass LineItem:\n    sku: str\n    unit_price_cents:\
      \ int\n    quantity: int\n\n\ndef subtotal_cents(items):\n    return sum(i.unit_price_cents * i.quantity for i in items)\n\
      \n\ndef apply_discount(total_cents, percent):\n    if not 0 <= percent <= 100:\n        raise ValueError(f\"discount\
      \ must be between 0 and 100, got {percent}\")\n    return total_cents - total_cents * percent // 100\n\n\ndef tax_cents(total_cents,\
      \ rate=0.0825):\n    return round(total_cents * rate)\n\n\ndef format_cents(cents):\n    return f\"${cents / 100:,.2f}\"\
      \n"
- op: commit
