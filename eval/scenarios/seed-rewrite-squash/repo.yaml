description: Three agent commits squashed into one (SC-004).
category: seed
authors:
  base: owner@example.test
  ada: ada@example.test
unmapped: []
streams:
- file: 01-ada-anthropic_messages.sse
  author: ada
  api_format: anthropic_messages
- file: 02-ada-openai_chat.sse
  author: ada
  api_format: openai_chat
operations:
- op: commit
  branch: main
  author: base
  message: base
  files:
    README.md: '# shop

      '
- op: branch
  name: work
  from: main
- op: commit
  branch: work
  author: ada
  message: 'ada: change'
  files:
    src/squash_orders.py: "def order_total(order):\n    lines = order.get('lines', [])\n    gross = sum(line['price'] * line['qty']\
      \ for line in lines)\n    discount = order.get('discount_cents', 0)\n    return max(gross - discount, 0)\n\n\ndef is_paid(order):\n\
      \    return order.get('status') in ('paid', 'refunded')\n"
- op: commit
  branch: work
  author: ada
  message: 'ada: change'
  files:
    src/squash_shipping.py: "RATES = {'standard': 499, 'express': 1299, 'overnight': 2499}\n\n\ndef shipping_cents(method,\
      \ weight_kg):\n    base = RATES[method]\n    surcharge = max(0, round((weight_kg - 2) * 150))\n    return base + surcharge\n"
- op: squash
  from: work
  into: feature
  base: main
  author: ada
  message: orders and shipping
pr:
  base: main
  head: feature
