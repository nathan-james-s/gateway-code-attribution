    src/rebase_orders.py: "def order_total(order):\n    lines = order.get('lines', [])\n    gross = sum(line['price'] * line['qty']\
      \ for line in lines)\n    discount = order.get('discount_cents', 0)\n    return max(gross - discount, 0)\n\n\ndef is_paid(order):\n\
      \    return order.get('status') in ('paid', 'refunded')\n"
- op: commit
  branch: feature
  author: ada
  message: 'ada: change'
  files:
    src/rebase_shipping.py: "RATES = {'standard': 499, 'express': 1299, 'overnight': 2499}\n\n\ndef shipping_cents(method,\
      \ weight_kg):\n    base = RATES[method]\n    surcharge = max(0, round((weight_kg - 2) * 150))\n    return base + surcharge\n"
- op: commit
  branch: main
  author: base
  message: 'base: change'
